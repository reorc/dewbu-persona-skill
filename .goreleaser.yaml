version: 2

project_name: voc
dist: dist

env:
  - CGO_ENABLED=0

before:
  hooks:
    - mkdir -p .release-extra
    - tar -czf .release-extra/voc-skills.tar.gz -C skills .

builds:
  - id: voc
    binary: voc
    main: ./cmd/voc
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X main.Version={{ .Version }}
        -X main.GitCommit={{ .ShortCommit }}
        -X main.BuildTime={{ .CommitDate }}

archives:
  - id: voc
    ids:
      - voc
    formats:
      - tar.gz
    name_template: "voc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []

checksum:
  name_template: "voc_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: reorc
    name: dewbu-persona-skill
  name_template: "voc {{ .Version }}"
  make_latest: "auto"
  extra_files:
    - glob: ./.release-extra/voc-skills.tar.gz
      name_template: voc-skills_{{ .Version }}.tar.gz
    - glob: ./install.sh
      name_template: install.sh

changelog:
  disable: true
